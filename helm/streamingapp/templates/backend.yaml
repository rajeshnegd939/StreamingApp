{{- $root := . -}}
{{- $publicUrl := include "sa.publicUrl" . -}}
{{- range $name, $svc := .Values.backends }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "sa.labels" $root | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }}, tier: backend }
      annotations:
        checksum/secret: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum | trunc 12 }}
    spec:
      {{- if $svc.s3 }}
      serviceAccountName: {{ $root.Values.s3ServiceAccount }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ $name }}
          image: {{ include "sa.image" (dict "root" $root "image" $svc.image) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: streamingapp-secrets, key: mongo-uri } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: streamingapp-secrets, key: jwt-secret } }
            - name: CLIENT_URLS
              value: {{ $publicUrl | quote }}
            {{- if $svc.s3 }}
            # no AWS keys: the SDK gets credentials from EKS Pod Identity
            - name: AWS_REGION
              value: {{ $root.Values.aws.region }}
            - name: AWS_S3_BUCKET
              value: {{ $root.Values.aws.s3Bucket }}
            - name: STREAMING_PUBLIC_URL
              value: {{ $publicUrl | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ $svc.healthPath }}, port: {{ $svc.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ $svc.healthPath }}, port: {{ $svc.port }} }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 4
          resources: {{- toYaml $root.Values.backendResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "sa.labels" $root | nindent 4 }}
spec:
  selector: { app: {{ $name }} }
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
