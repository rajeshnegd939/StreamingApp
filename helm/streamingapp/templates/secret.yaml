{{- $ns := .Release.Namespace -}}
{{- $rootPw := include "sa.secretValue" (dict "ns" $ns "key" "mongo-root-password") -}}
{{- $appPw := include "sa.secretValue" (dict "ns" $ns "key" "mongo-app-password") -}}
{{- $jwt := include "sa.secretValue" (dict "ns" $ns "key" "jwt-secret") -}}
apiVersion: v1
kind: Secret
metadata:
  name: streamingapp-secrets
  labels: {{- include "sa.labels" . | nindent 4 }}
type: Opaque
stringData:
  mongo-root-password: {{ $rootPw | quote }}
  mongo-app-password: {{ $appPw | quote }}
  jwt-secret: {{ $jwt | quote }}
  mongo-uri: {{ printf "mongodb://%s:%s@mongodb-0.mongodb:27017/%s?authSource=%s" .Values.mongodb.appUser $appPw .Values.mongodb.database .Values.mongodb.database | quote }}
